name: CJD Autopost

on:
  schedule:
    - cron: "*/15 * * * *"        # every 15 minutes (GitHub may start a few minutes late)
  workflow_dispatch:
    inputs:
      mode:
        description: "post = post what is due | check = test logins | dry-run = show what would post"
        type: choice
        options: [post, check, dry-run]
        default: post

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write                 # create/delete queue releases + save state/posted.json

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # latest history, not the commit from when this run was queued

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.mode == 'dry-run' && '1' || '' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LI_ORG_ID: ${{ secrets.LI_ORG_ID }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_REFRESH_TOKEN: ${{ secrets.LI_REFRESH_TOKEN }}
          LI_CLIENT_ID: ${{ secrets.LI_CLIENT_ID }}
          LI_CLIENT_SECRET: ${{ secrets.LI_CLIENT_SECRET }}
          LI_VERSION: ${{ vars.LI_VERSION }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          KEEP_RELEASES: ${{ vars.KEEP_RELEASES }}
        run: |
          if [ "${{ inputs.mode }}" = "check" ]; then python autopost.py --check; else python autopost.py; fi

      - name: Save posting history
        if: always()
        run: |
          git config user.name  "cjd-autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "autopost: update history [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
